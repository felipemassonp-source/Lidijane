<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Área restrita · Lidijane Araújo</title>
  <link rel="icon" type="image/png" href="assets/img/simbolo-lidijane-192.png">
  <link rel="preload" href="assets/fonts/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm">

  <!-- LOGIN -->
  <main id="view-login" class="adm-login" hidden>
    <div class="adm-login__card">
      <img class="adm-login__logo" src="assets/img/logo-lidijane.webp" alt="Lidijane Araújo · Fonoaudióloga" width="1421" height="631">
      <h1 class="adm-login__title">Acesso <em>restrito</em></h1>

      <div id="login-msg" class="adm-alert" role="alert" hidden></div>

      <div id="login-forms">
        <button type="button" id="btn-google" class="adm-btn adm-btn--google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Entrar com Google
        </button>
      </div>

      <div id="login-setup" class="adm-setup" hidden></div>
      <a class="adm-back" href="index.html">← Voltar para o site</a>
    </div>
  </main>

  <!-- PAINEL -->
  <div id="view-panel" hidden>
    <header class="adm-top">
      <div class="adm-wrap adm-top__in">
        <a href="index.html" class="adm-top__brand"><img src="assets/img/logo-lidijane.webp" alt="Lidijane Araújo" width="1421" height="631"></a>
        <div class="adm-top__who"><span id="who"></span></div>
        <div class="adm-top__actions">
          <button type="button" id="btn-export" class="adm-btn adm-btn--ghost adm-btn--sm">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Baixar planilha
          </button>
          <button type="button" id="btn-logout" class="adm-btn adm-btn--sm adm-btn--quiet">Sair</button>
        </div>
      </div>
    </header>

    <main class="adm-wrap adm-main">
      <div id="demo-banner" class="adm-demo" hidden>
        Modo demonstração: estes leads são de exemplo e nada é salvo. <a href="admin.html">Sair da demonstração</a>
      </div>

      <div class="adm-head">
        <div>
          <span class="adm-kicker">Área restrita</span>
          <h1 class="adm-h1">Leads dos <em>materiais gratuitos</em></h1>
        </div>
        <div class="adm-views" role="tablist" aria-label="Visualização">
          <button type="button" role="tab" data-view="kanban">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z"/></svg>Kanban</button>
          <button type="button" role="tab" data-view="lista">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lista</button>
        </div>
      </div>

      <section class="adm-metrics" id="metrics" aria-label="Resumo"></section>

      <div class="adm-filters">
        <label class="adm-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="f-busca" placeholder="Buscar por nome, e-mail, WhatsApp ou cidade" aria-label="Buscar">
        </label>
        <select id="f-material" aria-label="Filtrar por material"><option value="">Todos os materiais</option></select>
        <select id="f-perfil" aria-label="Filtrar por perfil"><option value="">Todos os perfis</option></select>
        <select id="f-status" aria-label="Filtrar por etapa"><option value="">Todas as etapas</option></select>
      </div>

      <p id="state-msg" class="adm-state" hidden></p>
      <section id="board" class="adm-board" hidden></section>
      <section id="list" class="adm-list" hidden></section>
    </main>
  </div>

  <div id="toast" class="adm-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
